<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca Livro</title>
  <link rel="stylesheet" href="/css">
</head>
<body>
  <div class="container">
    <h2>Busque um Livro</h2>
    <form action="/buscar-livros" method="POST">
      <div class="form-group">
        <label for="livroId">Por ID</label>
        <input type="number" id="livroId" name="livroId">
      </div>
      <div class="form-group">
        <label for="titulo">Por Titulo</label>
        <input type="text" id="titulo" name="titulo">
      </div>
      <button type="submit">Buscar</button>
    </form>
  </div>
</body>
</html>
