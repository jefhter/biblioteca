<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Busca Leitor</title>
  <link rel="stylesheet" href="/css">
</head>
<body>
  <div class="container">
    <h2>Busque um Leitor</h2>
    <form action="/buscar-leitores/" method="POST">
      <div class="form-group">
        <label for="leitorId">Por ID</label>
        <input type="number" id="leitorId" name="leitorId">
      </div>
      <div class="form-group">
        <label for="nome">Por Nome</label>
        <input type="text" id="nome" name="nome">
      </div>
      <button type="submit">Buscar</button>
    </form>
  </div>
</body>
</html>
