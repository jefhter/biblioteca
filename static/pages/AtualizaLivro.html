<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atualizacao</title>
  <link rel="stylesheet" href="/css">
</head>
<body>
  <div class="container">
    <h2>Atualizar Situação de Livro</h2>
    <form action="/atualizar-livro/" method="POST">
      <div class="form-group">
        <label for="livroId">Id do livro</label>
        <input type="number" id="livroId" name="livroId" required>
      </div>
      <div class="form-group">
        <input type="hidden" name="emprestado" value="false">
        <input type="checkbox" id="emprestado" name="emprestado" value="true">
        <label for="emprestado">Esta emprestado?</label>
      </div>
      <button type="submit">Atualizar</button>
    </form>
  </div>
</body>
</html>
